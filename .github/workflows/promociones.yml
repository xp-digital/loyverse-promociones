name: Automatizador de promociones Loyverse

on:
  workflow_dispatch:

  schedule:
    - cron: "0 14 * * *"

jobs:

  ejecutar-promociones:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ejecutar automatizador
        env:
          LOYVERSE_TOKEN: ${{ secrets.LOYVERSE_TOKEN }}
        run: node index.js

# Workflow de automatización de promociones Loyverse
